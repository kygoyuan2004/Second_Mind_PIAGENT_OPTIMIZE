name: Container image

on:
  workflow_call:
    inputs:
      preview_source:
        description: Commit of the tested preview tag
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish linux/amd64 and linux/arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.preview_source || github.sha }}
      - name: Check the release source and select its channel
        id: source
        env:
          PREVIEW_SOURCE: ${{ inputs.preview_source }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          commit=$(git rev-parse HEAD)
          if [[ -n "$PREVIEW_SOURCE" ]]; then
            tag="preview-v$version"
            test "$GITHUB_REF" = "refs/heads/publish/pi-$version-preview"
            test "$commit" = "$PREVIEW_SOURCE"
            test "$(git ls-remote --refs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$tag" | cut -f1)" = "$commit"
            echo "preview_tag=ghcr.io/kygoyuan2004/second_mind_piagent_optimize:$tag" >> "$GITHUB_OUTPUT"
          else
            test "$GITHUB_REF" = "refs/tags/v$version"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Enable emulated architectures
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive public image tags
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/kygoyuan2004/second_mind_piagent_optimize
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-
            type=ref,event=tag
      - name: Build candidate image from the allowlisted context
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kygoyuan2004/second_mind_piagent_optimize:candidate-${{ steps.source.outputs.commit }}
          labels: |
            ${{ steps.metadata.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Release exported build cache before runtime verification
        run: docker buildx prune --all --force
      - name: Verify SDK and media on both container architectures
        env:
          CANDIDATE: ghcr.io/kygoyuan2004/second_mind_piagent_optimize@${{ steps.image.outputs.digest }}
          PREVIEW_TAG: ${{ steps.source.outputs.preview_tag }}
        run: |
          set -Eeuo pipefail
          run_gate() {
            local phase="$1"
            shift
            local log="${RUNNER_TEMP}/container-runtime-gate.log"
            if "$@" > "$log" 2>&1; then
              cat "$log"
            else
              local status=$?
              cat "$log"
              python3 - "$phase" "$log" <<'PY'
          import pathlib, sys
          message = sys.argv[1] + '\n' + pathlib.Path(sys.argv[2]).read_text(errors='replace')[-16000:]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Container runtime gate::' + message)
          PY
              df -h
              docker system df
              return "$status"
            fi
          }
          for platform in linux/amd64 linux/arm64; do
            run_gate "$platform pull" docker pull --platform "$platform" "$CANDIDATE"
            run_gate "$platform SDK" docker run --rm --platform "$platform" --read-only \
              --tmpfs /tmp:rw,nosuid,size=768m \
              --mount type=bind,source="$GITHUB_WORKSPACE/test",target=/app/test,readonly \
              --env KNOWLEDGE_BASE_ALLOWED_ROOTS= --workdir /app \
              "$CANDIDATE" node --test test/sdk-provider-matrix.test.mjs
            run_gate "$platform media" docker run --rm --platform "$platform" --read-only "$CANDIDATE" \
              /opt/media/bin/python -c 'import av, ctranslate2, faster_whisper, yt_dlp; print("media imports passed")'
            run_gate "$platform ffmpeg" docker run --rm --platform "$platform" --read-only "$CANDIDATE" ffmpeg -version
            if [[ -n "$PREVIEW_TAG" ]]; then
              run_gate "$platform speech model" docker run --rm --platform "$platform" --read-only --tmpfs /tmp "$CANDIDATE" \
                node --input-type=module -e '
                  import assert from "node:assert/strict";
                  import { SpeechModel } from "./src/speech-model.mjs";
                  const model = new SpeechModel({ stateRoot: "/tmp/preview", python: "/opt/media/bin/python" });
                  const status = await model.status();
                  assert.equal(status.state, "not-downloaded");
                  assert.equal(status.totalBytes, 486212372);
                  await model.close();
                '
            fi
            docker image rm "$CANDIDATE"
          done
      - name: Promote the verified digest to release tags
        env:
          CANDIDATE: ghcr.io/kygoyuan2004/second_mind_piagent_optimize@${{ steps.image.outputs.digest }}
          RELEASE_TAGS: ${{ steps.source.outputs.preview_tag || steps.metadata.outputs.tags }}
        run: |
          set -Eeuo pipefail
          tags=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || tags+=(--tag "$tag")
          done <<< "$RELEASE_TAGS"
          docker buildx imagetools create "${tags[@]}" "$CANDIDATE"
          expected="${CANDIDATE##*@}"
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            actual=$(docker buildx imagetools inspect "$tag" | awk '$1 == "Digest:" && !seen { print $2; seen=1 }')
            test "$actual" = "$expected"
          done <<< "$RELEASE_TAGS"
