name: Pi release
on:
  push:
    branches: ['release/pi-v*']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pi-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  windows:
    uses: ./.github/workflows/windows-build.yml
  linux:
    uses: ./.github/workflows/linux-desktop.yml
  macos:
    uses: ./.github/workflows/macos-desktop.yml
  assemble:
    needs: [verify, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: SecondMindPi-*
          path: packages
      - name: Verify five independently built installers and their recorded hashes
        run: |
          tag=v$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_TYPE" = tag ]]; then test "$GITHUB_REF_NAME" = "$tag"; fi
          node scripts/release-assets.mjs packages release-files "$tag"
          (cd release-files && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: verified-installers
          path: release-files/
          compression-level: 0
          if-no-files-found: error
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
  public-registry:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    uses: ./.github/workflows/verify-public-image.yml
    with:
      version: ${{ github.ref_name }}
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [assemble, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-installers
          path: verified
      - name: Stage the verified release for owner review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd verified && sha256sum -c SHA256SUMS.txt)
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/draft-status"; then
            grep -Fx true "$RUNNER_TEMP/draft-status"
            gh release upload "$tag" verified/* --clobber
          else
            gh release create "$tag" verified/* --draft --verify-tag --title "Second Mind Pi $tag" --notes-file "docs/release-notes-${tag#v}.md"
          fi
