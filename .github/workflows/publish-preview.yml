name: Publish verified Pi preview
on:
  push:
    branches: [publish/pi-0.3.1-preview]

permissions:
  contents: read
concurrency:
  group: publish-pi-preview-v0.3.1
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'kygoyuan2004/Second_Mind_PIAGENT_OPTIMIZE' && github.actor == github.repository_owner
    uses: ./.github/workflows/container.yml
    with:
      preview_source: 091765fcdb1cf6a863b5688f17d90b9371aaf874
    permissions:
      contents: read
      packages: write

  release:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: preview-v0.3.1
      SOURCE: 091765fcdb1cf6a863b5688f17d90b9371aaf874
      BUILD_RUN: '45620337386'
      ARTIFACT_ID: '15027716209'
      ARCHIVE_SHA256: 61045d0d61131112b0a875316ac0cef7e4b699b36ef38742f5df09cf01259adf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - name: Retrieve the accepted installers from the tested commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" | jq -e \
            --arg sha "$SOURCE" '.head_sha == $sha and .conclusion == "success" and .path == ".github/workflows/release.yml"' >/dev/null
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID" | jq -e \
            --arg digest "sha256:$ARCHIVE_SHA256" --argjson run "$BUILD_RUN" \
            '.name == "verified-installers" and (.expired | not) and .digest == $digest and .workflow_run.id == $run' >/dev/null
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" --output installers.zip
          printf '%s  installers.zip\n' "$ARCHIVE_SHA256" | sha256sum --check --strict
          mkdir installers
          unzip -q installers.zip -d installers
          cd installers
          printf '%s\n' SecondMindPi-0.3.1-{linux-amd64.deb,linux-x86_64.AppImage,macos-arm64.dmg,macos-x64.dmg,windows-x64-setup.exe} | sort > "$RUNNER_TEMP/names"
          diff -u <(sort "$RUNNER_TEMP/names" <(printf 'SHA256SUMS.txt\n')) <(find . -mindepth 1 -printf '%P\n' | sort)
          diff -u "$RUNNER_TEMP/names" <(awk '{print $2}' SHA256SUMS.txt | sort)
          sha256sum --check --strict SHA256SUMS.txt
      - name: Publish as a prerelease after validating GitHub asset digests
        shell: bash
        run: |
          set -euo pipefail
          notes="$GITHUB_WORKSPACE/docs/release-notes-0.3.1.md"
          cd "$RUNNER_TEMP/installers"
          if ! gh release view "$TAG" --json isDraft,isPrerelease > "$RUNNER_TEMP/state"; then
            gh release create "$TAG" --verify-tag --draft --prerelease --latest=false \
              --title "Second Mind Pi v0.3.1 Preview" --notes-file "$notes"
            gh release view "$TAG" --json isDraft,isPrerelease > "$RUNNER_TEMP/state"
          fi
          jq -e '.isPrerelease' "$RUNNER_TEMP/state" >/dev/null
          if jq -e '.isDraft' "$RUNNER_TEMP/state" >/dev/null; then
            gh release upload "$TAG" ./* --clobber
          fi
          sha256sum * | sort -k2 > "$RUNNER_TEMP/local-digests"
          release_id=$(gh release view "$TAG" --json databaseId --jq '.databaseId')
          gh api "repos/$GH_REPO/releases/$release_id" --jq '.assets[] | [(.digest | sub("^sha256:"; "")), .name] | join("  ")' \
            | sort -k2 > "$RUNNER_TEMP/remote-digests"
          diff -u "$RUNNER_TEMP/local-digests" "$RUNNER_TEMP/remote-digests"
          if jq -e '.isDraft' "$RUNNER_TEMP/state" >/dev/null; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          fi
          test "$(gh release view "$TAG" --json isDraft,isPrerelease --jq '(.isDraft | not) and .isPrerelease')" = true
